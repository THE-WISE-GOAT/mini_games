<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Breakout</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #12121a;
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 16px;
            text-align: center;
        }

        h1 {
            margin: 0 0 10px;
            font-size: 1.6rem;
        }

        .hud {
            display: flex;
            gap: 26px;
            color: #999;
            margin-bottom: 12px;
        }

        .hud strong {
            color: #ffd60a;
            font-weight: 600;
        }

        canvas {
            background: #191922;
            border: 2px solid #333;
            border-radius: 8px;
            max-width: 100%;
            touch-action: none;
        }

        .hint {
            margin-top: 12px;
            color: #777;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>Breakout</h1>

    <div class="hud">
        <span>Score: <strong id="score">0</strong></span>
        <span>Level: <strong id="level">1</strong></span>
        <span>Lives: <strong id="lives">3</strong></span>
    </div>

    <canvas id="game" width="480" height="420"></canvas>

    <p class="hint">Move the mouse (or use Left / Right) to steer &middot; Space to launch or restart</p>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const livesEl = document.getElementById('lives');

        const PADDLE_W = 84;
        const PADDLE_H = 12;
        const BALL_R = 7;
        const ROWS = 5;
        const COLS = 8;
        const BRICK_H = 20;
        const BRICK_GAP = 6;
        const BRICK_TOP = 46;
        const ROW_COLORS = ['#e74c3c', '#e67e22', '#f1c40f', '#2ecc71', '#3498db'];

        const paddle = { x: canvas.width / 2 - PADDLE_W / 2, y: canvas.height - 30 };
        const ball = { x: 0, y: 0, vx: 0, vy: 0 };

        let bricks = [];
        let score = 0;
        let level = 1;
        let lives = 3;
        let stuck = true;
        let gameOver = false;
        let keys = { left: false, right: false };

        const brickWidth = (canvas.width - BRICK_GAP * (COLS + 1)) / COLS;

        function buildBricks() {
            bricks = [];
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    bricks.push({
                        x: BRICK_GAP + c * (brickWidth + BRICK_GAP),
                        y: BRICK_TOP + r * (BRICK_H + BRICK_GAP),
                        w: brickWidth,
                        h: BRICK_H,
                        color: ROW_COLORS[r],
                        alive: true,
                        points: ROWS - r
                    });
                }
            }
        }

        function parkBall() {
            ball.x = paddle.x + PADDLE_W / 2;
            ball.y = paddle.y - BALL_R - 1;
            ball.vx = 0;
            ball.vy = 0;
            stuck = true;
        }

        function launch() {
            const speed = 4.2 + (level - 1) * 0.5;
            const angle = (Math.random() * 0.6 - 0.3) - Math.PI / 2;
            ball.vx = Math.cos(angle) * speed;
            ball.vy = Math.sin(angle) * speed;
            stuck = false;
        }

        function reset(full) {
            paddle.x = canvas.width / 2 - PADDLE_W / 2;
            if (full) {
                score = 0;
                level = 1;
                lives = 3;
                gameOver = false;
                buildBricks();
                updateHud();
            }
            parkBall();
        }

        function updateHud() {
            scoreEl.textContent = score;
            levelEl.textContent = level;
            livesEl.textContent = lives;
        }

        function loseLife() {
            lives--;
            updateHud();
            if (lives <= 0) {
                gameOver = true;
                return;
            }
            parkBall();
        }

        function update() {
            if (keys.left) paddle.x -= 7;
            if (keys.right) paddle.x += 7;
            paddle.x = Math.max(0, Math.min(canvas.width - PADDLE_W, paddle.x));

            if (stuck) {
                ball.x = paddle.x + PADDLE_W / 2;
                ball.y = paddle.y - BALL_R - 1;
                return;
            }
            if (gameOver) return;

            const prevX = ball.x;
            const prevY = ball.y;
            ball.x += ball.vx;
            ball.y += ball.vy;

            if (ball.x <= BALL_R) {
                ball.x = BALL_R;
                ball.vx *= -1;
            } else if (ball.x >= canvas.width - BALL_R) {
                ball.x = canvas.width - BALL_R;
                ball.vx *= -1;
            }
            if (ball.y <= BALL_R) {
                ball.y = BALL_R;
                ball.vy *= -1;
            }

            const onPaddle = ball.y + BALL_R >= paddle.y &&
                ball.y + BALL_R <= paddle.y + PADDLE_H + 8 &&
                ball.x >= paddle.x - BALL_R &&
                ball.x <= paddle.x + PADDLE_W + BALL_R &&
                ball.vy > 0;

            if (onPaddle) {
                ball.y = paddle.y - BALL_R;
                const offset = (ball.x - (paddle.x + PADDLE_W / 2)) / (PADDLE_W / 2);
                const speed = Math.min(Math.hypot(ball.vx, ball.vy) * 1.02, 9);
                const angle = offset * (Math.PI / 3);
                ball.vx = Math.sin(angle) * speed;
                ball.vy = -Math.cos(angle) * speed;
            }

            for (const brick of bricks) {
                if (!brick.alive) continue;

                const overlapX = Math.min(ball.x + BALL_R, brick.x + brick.w) - Math.max(ball.x - BALL_R, brick.x);
                const overlapY = Math.min(ball.y + BALL_R, brick.y + brick.h) - Math.max(ball.y - BALL_R, brick.y);

                if (overlapX > 0 && overlapY > 0) {
                    brick.alive = false;
                    score += brick.points;
                    updateHud();

                    const wasLeft = prevX + BALL_R <= brick.x;
                    const wasRight = prevX - BALL_R >= brick.x + brick.w;
                    const wasAbove = prevY + BALL_R <= brick.y;
                    const wasBelow = prevY - BALL_R >= brick.y + brick.h;

                    if (wasLeft || wasRight) ball.vx *= -1;
                    else if (wasAbove || wasBelow) ball.vy *= -1;
                    else if (overlapX < overlapY) ball.vx *= -1;
                    else ball.vy *= -1;
                    break;
                }
            }

            if (bricks.every((b) => !b.alive)) {
                level++;
                buildBricks();
                updateHud();
                parkBall();
            }

            if (ball.y - BALL_R > canvas.height) {
                loseLife();
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (const brick of bricks) {
                if (!brick.alive) continue;
                ctx.fillStyle = brick.color;
                ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
            }

            ctx.fillStyle = '#ecf0f1';
            ctx.fillRect(paddle.x, paddle.y, PADDLE_W, PADDLE_H);

            ctx.fillStyle = '#ffd60a';
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, BALL_R, 0, Math.PI * 2);
            ctx.fill();

            ctx.textAlign = 'center';

            if (gameOver) {
                banner('Game over', `Score ${score} — press Space to play again`);
            } else if (stuck) {
                banner(level > 1 ? `Level ${level}` : 'Ready', 'Press Space or click to launch');
            }
            ctx.textAlign = 'left';
        }

        function banner(title, detail) {
            ctx.fillStyle = 'rgba(0,0,0,0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#fff';
            ctx.font = "bold 28px 'Segoe UI', sans-serif";
            ctx.textAlign = 'center';
            ctx.fillText(title, canvas.width / 2, canvas.height / 2 - 8);
            ctx.fillStyle = '#ccc';
            ctx.font = "15px 'Segoe UI', sans-serif";
            ctx.fillText(detail, canvas.width / 2, canvas.height / 2 + 24);
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const scale = canvas.width / rect.width;
            const x = (e.clientX - rect.left) * scale;
            paddle.x = Math.max(0, Math.min(canvas.width - PADDLE_W, x - PADDLE_W / 2));
        });

        canvas.addEventListener('click', () => {
            if (gameOver) reset(true);
            else if (stuck) launch();
        });

        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') { e.preventDefault(); keys.left = true; }
            if (e.key === 'ArrowRight') { e.preventDefault(); keys.right = true; }
            if (e.key === ' ') {
                e.preventDefault();
                if (gameOver) reset(true);
                else if (stuck) launch();
            }
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowLeft') keys.left = false;
            if (e.key === 'ArrowRight') keys.right = false;
        });

        reset(true);
        loop();
    </script>
</body>
</html>
