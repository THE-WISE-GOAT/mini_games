<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simon</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            background: #101010;
            color: #eee;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 16px;
            text-align: center;
        }

        h1 {
            margin: 0 0 14px;
            font-size: 1.6rem;
        }

        .hud {
            display: flex;
            gap: 28px;
            color: #999;
            margin-bottom: 20px;
        }

        .hud strong {
            color: #ffd60a;
            font-weight: 600;
        }

        .simon {
            position: relative;
            width: min(80vw, 320px);
            aspect-ratio: 1;
            border-radius: 50%;
            overflow: hidden;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            background: #101010;
            padding: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
        }

        .pad {
            border: none;
            cursor: pointer;
            opacity: 0.45;
            transition: opacity 0.1s ease, transform 0.1s ease;
        }

        .pad:disabled {
            cursor: default;
        }

        .pad.lit,
        .pad:hover:not(:disabled) {
            opacity: 1;
        }

        .pad:active:not(:disabled) {
            transform: scale(0.98);
        }

        .pad.green  { background: #2ecc71; border-radius: 100% 8px 8px 8px; }
        .pad.red    { background: #e74c3c; border-radius: 8px 100% 8px 8px; }
        .pad.yellow { background: #f1c40f; border-radius: 8px 8px 100% 8px; }
        .pad.blue   { background: #3498db; border-radius: 8px 8px 8px 100%; }

        .core {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 44%;
            aspect-ratio: 1;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            background: #161616;
            border: 4px solid #101010;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            z-index: 2;
        }

        #message {
            color: #bbb;
            font-size: 0.85rem;
            min-height: 2.4em;
            max-width: 9em;
        }

        #startBtn {
            padding: 8px 18px;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            background: #2ecc71;
            color: #08341c;
            cursor: pointer;
        }

        #startBtn:hover {
            background: #28b463;
        }

        .hint {
            margin-top: 18px;
            color: #777;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <h1>Simon</h1>

    <div class="hud">
        <span>Level: <strong id="level">0</strong></span>
        <span>Best: <strong id="best">0</strong></span>
    </div>

    <div class="simon">
        <button class="pad green" data-pad="0" type="button" aria-label="Green pad" disabled></button>
        <button class="pad red" data-pad="1" type="button" aria-label="Red pad" disabled></button>
        <button class="pad blue" data-pad="2" type="button" aria-label="Blue pad" disabled></button>
        <button class="pad yellow" data-pad="3" type="button" aria-label="Yellow pad" disabled></button>

        <div class="core">
            <div id="message">Press start</div>
            <button id="startBtn" type="button">Start</button>
        </div>
    </div>

    <p class="hint">Watch the sequence, then repeat it. One mistake ends the run.</p>

    <script>
        const FREQUENCIES = [329.63, 261.63, 220.0, 164.81];
        const LIT_MS = 340;
        const GAP_MS = 160;

        const pads = Array.from(document.querySelectorAll('.pad'));
        const levelEl = document.getElementById('level');
        const bestEl = document.getElementById('best');
        const messageEl = document.getElementById('message');
        const startBtn = document.getElementById('startBtn');

        let sequence = [];
        let inputIndex = 0;
        let accepting = false;
        let busy = false;
        let best = 0;

        try {
            best = Number(localStorage.getItem('simon-best')) || 0;
        } catch (e) {
            best = 0;
        }
        bestEl.textContent = best;

        let audioContext = null;
        function tone(index, duration) {
            try {
                if (!audioContext) {
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                }
                const oscillator = audioContext.createOscillator();
                const gain = audioContext.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.value = FREQUENCIES[index];
                gain.gain.setValueAtTime(0.0001, audioContext.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.2, audioContext.currentTime + 0.02);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioContext.currentTime + duration / 1000);
                oscillator.connect(gain).connect(audioContext.destination);
                oscillator.start();
                oscillator.stop(audioContext.currentTime + duration / 1000 + 0.05);
            } catch (e) {
                // audio unavailable — lights still work
            }
        }

        const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

        function light(index, duration = LIT_MS) {
            const pad = pads[index];
            pad.classList.add('lit');
            tone(index, duration);
            return wait(duration).then(() => pad.classList.remove('lit'));
        }

        async function playback() {
            busy = true;
            accepting = false;
            pads.forEach((p) => { p.disabled = true; });
            messageEl.textContent = 'Watch…';
            await wait(500);

            for (const step of sequence) {
                await light(step);
                await wait(GAP_MS);
            }

            inputIndex = 0;
            accepting = true;
            busy = false;
            pads.forEach((p) => { p.disabled = false; });
            messageEl.textContent = 'Your turn';
        }

        function extendSequence() {
            sequence.push(Math.floor(Math.random() * 4));
            levelEl.textContent = String(sequence.length);
            playback();
        }

        function padPressed(index) {
            if (!accepting) return;

            light(index, 220);

            if (sequence[inputIndex] !== index) {
                accepting = false;
                messageEl.textContent = 'Wrong pad — game over';
                failFlash();
                return;
            }

            inputIndex++;
            if (inputIndex === sequence.length) {
                accepting = false;
                if (sequence.length > best) {
                    best = sequence.length;
                    bestEl.textContent = best;
                    try {
                        localStorage.setItem('simon-best', String(best));
                    } catch (e) {
                        // storage unavailable
                    }
                }
                messageEl.textContent = 'Nice — next round';
                setTimeout(extendSequence, 900);
            }
        }

        async function failFlash() {
            pads.forEach((p) => { p.disabled = true; });
            for (let i = 0; i < 3; i++) {
                pads.forEach((p) => p.classList.add('lit'));
                await wait(160);
                pads.forEach((p) => p.classList.remove('lit'));
                await wait(160);
            }
            messageEl.textContent = 'Press start to try again';
            startBtn.textContent = 'Restart';
        }

        function start() {
            sequence = [];
            inputIndex = 0;
            accepting = false;
            levelEl.textContent = '0';
            startBtn.textContent = 'Restart';
            extendSequence();
        }

        pads.forEach((pad, index) => {
            pad.addEventListener('click', () => padPressed(index));
        });
        startBtn.addEventListener('click', start);
    </script>
</body>
</html>
