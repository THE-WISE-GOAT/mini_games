<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Catch the Square</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
      text-align: center;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.6rem;
    }

    .hud {
      display: flex;
      gap: 28px;
      margin-bottom: 16px;
      color: #999;
    }

    .hud strong {
      color: #ffd60a;
      font-weight: 600;
    }

    #gameArea {
      position: relative;
      width: min(100%, 600px);
      height: min(60vh, 400px);
      background: #1d1d1d;
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
    }

    #square {
      position: absolute;
      width: 52px;
      height: 52px;
      background: #e91e63;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: left 0.08s ease-in-out, top 0.08s ease-in-out;
      padding: 0;
    }

    #square:disabled {
      cursor: default;
      opacity: 0.3;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.7);
      pointer-events: none;
    }

    #overlay[hidden] {
      display: none;
    }

    #overlay .title {
      font-size: 1.6rem;
      font-weight: 700;
    }

    #overlay .detail {
      color: #bbb;
    }

    .controls {
      margin-top: 18px;
      display: flex;
      gap: 12px;
      align-items: center;
    }

    #startBtn {
      padding: 10px 26px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      background: #4caf50;
      color: #fff;
      border: none;
      border-radius: 8px;
    }

    #startBtn:hover:not(:disabled) {
      background: #43a047;
    }

    #startBtn:disabled {
      opacity: 0.6;
      cursor: default;
    }

    .hint {
      margin-top: 14px;
      color: #777;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Catch the Square</h1>

  <div class="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span>Time: <strong id="time">30</strong></span>
    <span>Best: <strong id="best">0</strong></span>
  </div>

  <div id="gameArea">
    <button id="square" type="button" aria-label="Target square" hidden></button>
    <div id="overlay">
      <div class="title">Ready?</div>
      <div class="detail">Click the square as many times as you can in 30 seconds.</div>
    </div>
  </div>

  <div class="controls">
    <button id="startBtn" type="button">Start Game</button>
  </div>

  <p class="hint">The square shrinks and jumps faster as your score climbs.</p>

  <script>
    const ROUND_SECONDS = 30;
    const MIN_DELAY = 260;
    const MAX_DELAY = 1000;

    const square = document.getElementById('square');
    const area = document.getElementById('gameArea');
    const scoreEl = document.getElementById('score');
    const timeEl = document.getElementById('time');
    const bestEl = document.getElementById('best');
    const overlay = document.getElementById('overlay');
    const startBtn = document.getElementById('startBtn');

    let score = 0;
    let timeLeft = ROUND_SECONDS;
    let running = false;
    let moveTimer = null;
    let clockTimer = null;
    let best = 0;

    try {
      best = Number(localStorage.getItem('catch-square-best')) || 0;
    } catch (e) {
      best = 0;
    }
    bestEl.textContent = best;

    function moveSquare() {
      const size = square.offsetWidth || 52;
      const x = Math.random() * Math.max(1, area.clientWidth - size);
      const y = Math.random() * Math.max(1, area.clientHeight - size);
      square.style.left = x + 'px';
      square.style.top = y + 'px';
    }

    function scheduleMove() {
      const delay = Math.max(MIN_DELAY, MAX_DELAY - score * 30);
      clearTimeout(moveTimer);
      moveTimer = setTimeout(() => {
        if (!running) return;
        moveSquare();
        scheduleMove();
      }, delay);
    }

    function showOverlay(title, detail) {
      overlay.querySelector('.title').textContent = title;
      overlay.querySelector('.detail').textContent = detail;
      overlay.hidden = false;
    }

    function endGame() {
      running = false;
      clearTimeout(moveTimer);
      clearInterval(clockTimer);
      square.hidden = true;
      startBtn.disabled = false;
      startBtn.textContent = 'Play Again';

      if (score > best) {
        best = score;
        bestEl.textContent = best;
        try {
          localStorage.setItem('catch-square-best', String(best));
        } catch (e) {
          // storage unavailable
        }
        showOverlay('Time\'s up!', `New best: ${score} clicks.`);
      } else {
        showOverlay('Time\'s up!', `You caught ${score}. Best is still ${best}.`);
      }
    }

    function startGame() {
      if (running) return;

      score = 0;
      timeLeft = ROUND_SECONDS;
      running = true;
      scoreEl.textContent = '0';
      timeEl.textContent = String(ROUND_SECONDS);
      overlay.hidden = true;
      startBtn.disabled = true;
      startBtn.textContent = 'Running…';
      square.hidden = false;
      moveSquare();
      scheduleMove();

      clockTimer = setInterval(() => {
        timeLeft--;
        timeEl.textContent = String(timeLeft);
        if (timeLeft <= 0) endGame();
      }, 1000);
    }

    square.addEventListener('click', () => {
      if (!running) return;
      score++;
      scoreEl.textContent = String(score);
      moveSquare();
      scheduleMove();
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
