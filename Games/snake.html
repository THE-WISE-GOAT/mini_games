<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Snake</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #0d0d0d;
      color: #eee;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    .hud {
      display: flex;
      gap: 28px;
      margin-bottom: 14px;
      color: #999;
    }

    .hud strong {
      color: #ffd60a;
      font-weight: 600;
    }

    #board {
      width: min(90vw, 440px);
      aspect-ratio: 1;
      background: #161616;
      border: 2px solid #2e2e2e;
      border-radius: 8px;
    }

    .keys {
      margin-top: 18px;
      display: grid;
      grid-template-columns: repeat(3, 64px);
      grid-template-rows: repeat(2, 64px);
      gap: 8px;
      justify-content: center;
    }

    .arr {
      font-size: 26px;
      line-height: 1;
      background: #1f1f1f;
      color: #ffd60a;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      user-select: none;
      transition: background 0.1s linear;
    }

    .arr:active {
      background: #000;
    }

    .arr.up    { grid-column: 2; grid-row: 1; }
    .arr.left  { grid-column: 1; grid-row: 2; }
    .arr.down  { grid-column: 2; grid-row: 2; }
    .arr.right { grid-column: 3; grid-row: 2; }

    .hint {
      margin-top: 16px;
      color: #777;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Snake</h1>

  <div class="hud">
    <span>Score: <strong id="score">0</strong></span>
    <span>Best: <strong id="best">0</strong></span>
  </div>

  <canvas id="board" width="400" height="400"></canvas>

  <div class="keys">
    <button class="arr up" type="button" aria-label="Up">&#9650;</button>
    <button class="arr left" type="button" aria-label="Left">&#9664;</button>
    <button class="arr down" type="button" aria-label="Down">&#9660;</button>
    <button class="arr right" type="button" aria-label="Right">&#9654;</button>
  </div>

  <p class="hint">Arrow keys or WASD to steer &middot; Space to pause &middot; Esc to restart</p>

  <script>
    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');

    const TILES = 20;
    const CELL = canvas.width / TILES;
    const STEP_MS = 100;

    const DIRS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 }
    };
    const OPPOSITE = { up: 'down', down: 'up', left: 'right', right: 'left' };

    let snake, dir, dirQueue, fruit, score, paused, over, acc, lastTime;

    let best = 0;
    try {
      best = Number(localStorage.getItem('snake-best')) || 0;
    } catch (e) {
      best = 0;
    }
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
      dir = 'right';
      dirQueue = [];
      score = 0;
      paused = false;
      over = false;
      acc = 0;
      lastTime = performance.now();
      dropFruit();
      updateHud();
    }

    function dropFruit() {
      if (snake.length >= TILES * TILES) {
        over = true;
        return;
      }
      do {
        fruit = {
          x: Math.floor(Math.random() * TILES),
          y: Math.floor(Math.random() * TILES)
        };
      } while (snake.some((s) => s.x === fruit.x && s.y === fruit.y));
    }

    function setDirection(name) {
      if (over) reset();
      const lastQueued = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
      if (name === lastQueued || name === OPPOSITE[lastQueued]) return;
      if (dirQueue.length < 2) dirQueue.push(name);
      if (paused) paused = false;
    }

    function step() {
      if (dirQueue.length) dir = dirQueue.shift();

      const head = { x: snake[0].x + DIRS[dir].x, y: snake[0].y + DIRS[dir].y };

      head.x = (head.x + TILES) % TILES;
      head.y = (head.y + TILES) % TILES;

      if (snake.some((s) => s.x === head.x && s.y === head.y)) {
        over = true;
        return;
      }

      snake.unshift(head);

      if (head.x === fruit.x && head.y === fruit.y) {
        score++;
        if (score > best) {
          best = score;
          try {
            localStorage.setItem('snake-best', String(best));
          } catch (e) {
            // storage unavailable (private mode, file:// in some browsers)
          }
        }
        updateHud();
        dropFruit();
      } else {
        snake.pop();
      }
    }

    function updateHud() {
      scoreEl.textContent = score;
      bestEl.textContent = best;
    }

    function cellRect(x, y, inset) {
      return [x * CELL + inset, y * CELL + inset, CELL - inset * 2, CELL - inset * 2];
    }

    function draw() {
      ctx.fillStyle = '#161616';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.strokeStyle = 'rgba(255,255,255,0.04)';
      ctx.lineWidth = 1;
      for (let i = 1; i < TILES; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      ctx.fillStyle = '#ff7a1a';
      ctx.beginPath();
      ctx.arc(fruit.x * CELL + CELL / 2, fruit.y * CELL + CELL / 2, CELL / 2 - 3, 0, Math.PI * 2);
      ctx.fill();

      snake.forEach((segment, i) => {
        ctx.fillStyle = i === 0 ? '#8be9fd' : '#4aa3df';
        const [x, y, w, h] = cellRect(segment.x, segment.y, 1.5);
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 5);
        ctx.fill();
      });

      if (over || paused) {
        ctx.fillStyle = 'rgba(0,0,0,0.65)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.textAlign = 'center';
        ctx.font = "bold 26px 'Segoe UI', sans-serif";
        ctx.fillText(over ? 'Game over' : 'Paused', canvas.width / 2, canvas.height / 2 - 10);
        ctx.fillStyle = '#aaa';
        ctx.font = "16px 'Segoe UI', sans-serif";
        ctx.fillText(over ? 'Press Esc or tap a direction to restart' : 'Press Space to resume', canvas.width / 2, canvas.height / 2 + 22);
        ctx.textAlign = 'left';
      }
    }

    function frame(time) {
      const delta = time - lastTime;
      lastTime = time;

      if (!paused && !over) {
        acc += delta;
        while (acc >= STEP_MS) {
          step();
          acc -= STEP_MS;
        }
      }

      draw();
      requestAnimationFrame(frame);
    }

    const keyMap = {
      ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
      w: 'up', s: 'down', a: 'left', d: 'right',
      W: 'up', S: 'down', A: 'left', D: 'right'
    };

    document.addEventListener('keydown', (e) => {
      if (keyMap[e.key]) {
        e.preventDefault();
        setDirection(keyMap[e.key]);
      } else if (e.key === ' ') {
        e.preventDefault();
        if (!over) paused = !paused;
      } else if (e.key === 'Escape') {
        e.preventDefault();
        reset();
      }
    });

    document.querySelector('.arr.up').addEventListener('click', () => setDirection('up'));
    document.querySelector('.arr.down').addEventListener('click', () => setDirection('down'));
    document.querySelector('.arr.left').addEventListener('click', () => setDirection('left'));
    document.querySelector('.arr.right').addEventListener('click', () => setDirection('right'));

    reset();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
